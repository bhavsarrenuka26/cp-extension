<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <style>
    
    :root {
      --bg:       #1e1e2e;
      --surface:  #2a2a3e;
      --border:   #3a3a52;
      --accent:   #7c6af7;
      --accent2:  #56cfb2;
      --text:     #cdd6f4;
      --subtext:  #a6adc8;
      --red:      #f38ba8;
      --green:    #a6e3a1;
      --tag-bg:   #313244;
    }
    [data-theme="light"] {
      --bg:       #f5f5ff;
      --surface:  #ffffff;
      --border:   #d0d0e8;
      --accent:   #5c4de8;
      --accent2:  #009e82;
      --text:     #2a2a3e;
      --subtext:  #6c6c88;
      --red:      #c0392b;
      --green:    #27ae60;
      --tag-bg:   #e8e8f8;
    }

    /*  Reset & base  */
    * { box-sizing: border-box; margin: 0; padding: 0; }
    body {
      font-family: "Segoe UI", system-ui, sans-serif;
      background: var(--bg);
      color: var(--text);
      width: 320px;
      min-height: 420px;
      font-size: 13px;
    }

    /*  Header */
    .header {
      display: flex;
      align-items: center;
      justify-content: space-between;
      padding: 12px 14px 0;
    }
    .logo {
      display: flex;
      align-items: center;
      gap: 8px;
    }
    .logo-icon {
      width: 26px; height: 26px;
      background: linear-gradient(135deg, var(--accent), var(--accent2));
      border-radius: 7px;
      display: flex; align-items: center; justify-content: center;
      font-size: 14px;
    }
    .logo-text { font-weight: 700; font-size: 14px; letter-spacing: 0.02em; }
    .logo-sub  { font-size: 10px; color: var(--subtext); }
    #theme-toggle {
      background: var(--surface);
      border: 1px solid var(--border);
      color: var(--text);
      border-radius: 8px;
      width: 30px; height: 30px;
      cursor: pointer;
      font-size: 14px;
      display: flex; align-items: center; justify-content: center;
    }

    /*  Nav  */
    .nav {
      display: flex;
      gap: 4px;
      padding: 10px 14px 0;
    }
    .nav-btn {
      flex: 1;
      padding: 6px 0;
      background: var(--surface);
      border: 1px solid var(--border);
      border-radius: 8px;
      color: var(--subtext);
      cursor: pointer;
      font-size: 12px;
      font-weight: 500;
      transition: all 0.15s;
    }
    .nav-btn.active {
      background: var(--accent);
      border-color: var(--accent);
      color: #fff;
    }
    .nav-btn:not(.active):hover { border-color: var(--accent); color: var(--text); }

    /*  Shared panel */
    .view { padding: 12px 14px 14px; display: none; }

    /* Form  */
    label { display: block; font-size: 11px; color: var(--subtext); margin-bottom: 5px; }
    select, textarea, input[type="text"] {
      width: 100%;
      background: var(--surface);
      border: 1px solid var(--border);
      border-radius: 8px;
      color: var(--text);
      padding: 8px 10px;
      font-size: 12.5px;
      font-family: inherit;
      outline: none;
      transition: border-color 0.15s;
    }
    select:focus, textarea:focus, input[type="text"]:focus {
      border-color: var(--accent);
    }
    select { cursor: pointer; }
    textarea { resize: vertical; font-family: "Consolas", "Fira Code", monospace; font-size: 11.5px; }

  
    .btn-primary {
      width: 100%;
      margin-top: 10px;
      padding: 9px;
      background: linear-gradient(135deg, var(--accent), #9a7fff);
      border: none;
      border-radius: 9px;
      color: #fff;
      font-weight: 700;
      font-size: 13px;
      cursor: pointer;
      transition: opacity 0.15s, transform 0.1s;
    }
    .btn-primary:hover  { opacity: 0.9; }
    .btn-primary:active { transform: scale(0.98); }

    .copy-btn {
      background: var(--tag-bg);
      border: 1px solid var(--border);
      border-radius: 6px;
      color: var(--text);
      padding: 3px 9px;
      font-size: 11px;
      cursor: pointer;
      transition: background 0.12s;
    }
    .copy-btn:hover { background: var(--accent); color: #fff; border-color: var(--accent); }

    .del-btn {
      background: transparent;
      border: 1px solid var(--border);
      border-radius: 6px;
      color: var(--red);
      padding: 3px 7px;
      font-size: 11px;
      cursor: pointer;
    }
    .del-btn:hover { background: var(--red); color: #fff; }

    /*  Status */
    .status { margin-top: 8px; font-size: 12px; min-height: 18px; text-align: center; }
    .status.success { color: var(--green); }
    .status.error   { color: var(--red); }

    /*  Detected */
    #detected-badge {
      display: none;
      margin-top: 6px;
      font-size: 11px;
      background: var(--tag-bg);
      border: 1px solid var(--border);
      border-radius: 20px;
      padding: 3px 10px;
      color: var(--accent2);
      text-align: center;
    }

    /*  Constraints box */
    #constraints-box {
      display: none;
      margin-top: 8px;
      background: var(--surface);
      border: 1px solid var(--border);
      border-radius: 8px;
      padding: 7px 10px;
      font-size: 11px;
      color: var(--subtext);
      white-space: pre-wrap;
      max-height: 70px;
      overflow-y: auto;
    }

    /* Tag */
    .tag {
      display: inline-block;
      background: var(--tag-bg);
      border-radius: 5px;
      padding: 2px 8px;
      font-size: 11px;
      color: var(--accent);
      font-weight: 600;
      text-transform: capitalize;
    }

    /*  History cards */
    .history-card {
      background: var(--surface);
      border: 1px solid var(--border);
      border-radius: 9px;
      padding: 9px 11px;
      margin-bottom: 8px;
    }
    .history-meta {
      display: flex;
      align-items: center;
      justify-content: space-between;
      margin-bottom: 5px;
    }
    .history-time { font-size: 10px; color: var(--subtext); }
    .history-title {
      font-size: 12px;
      font-weight: 500;
      margin-bottom: 7px;
      color: var(--text);
      white-space: nowrap;
      overflow: hidden;
      text-overflow: ellipsis;
    }

    /* Snippet cards */
    .snippet-card {
      background: var(--surface);
      border: 1px solid var(--border);
      border-radius: 9px;
      padding: 9px 11px;
      margin-bottom: 8px;
    }
    .snippet-header {
      display: flex;
      align-items: center;
      justify-content: space-between;
      margin-bottom: 6px;
    }
    .snippet-actions { display: flex; gap: 5px; }
    .snippet-preview {
      font-family: "Consolas", "Fira Code", monospace;
      font-size: 10.5px;
      color: var(--subtext);
      white-space: pre-wrap;
      word-break: break-all;
    }

    /*  Empty message  */
    .empty-msg {
      color: var(--subtext);
      font-size: 12px;
      text-align: center;
      padding: 20px 0;
    }

    /*  Snippet form */
    .snippet-form-label {
      font-size: 11px;
      color: var(--subtext);
      margin: 10px 0 4px;
      display: block;
    }
    .divider {
      border: none;
      border-top: 1px solid var(--border);
      margin: 12px 0;
    }
    .section-title {
      font-size: 11px;
      font-weight: 600;
      color: var(--subtext);
      text-transform: uppercase;
      letter-spacing: 0.06em;
      margin-bottom: 8px;
    }
  </style>
</head>
<body>

<!--  Header  -->
<div class="header">
  <div class="logo">
    <div>
      <div class="logo-text">CP Boilerplate</div>
      <div class="logo-sub">C++ Template Generator</div>
    </div>
  </div>
  <button id="theme-toggle" title="Toggle theme">🌙</button>
</div>

<!-- Nav  -->
<div class="nav">
  <button class="nav-btn" data-view="generator">Generate</button>
  <button class="nav-btn" data-view="history">History</button>
  <button class="nav-btn" data-view="snippets">Snippets</button>
</div>

<!-- Generator -->
<div id="view-generator" class="view">
  <label for="template-type">Template</label>
  <select id="template-type">
    <optgroup label="── Auto">
      <option value="auto"> Auto-detect from page</option>
    </optgroup>
    <optgroup label="── Standard">
      <option value="standard">Standard (Fast I/O)</option>
      <option value="prefix_sum">Prefix Sum</option>
    </optgroup>
    <optgroup label="── Data Structures">
      <option value="segment_tree">Segment Tree / BIT</option>
      <option value="trie">Trie</option>
      <option value="dsu">DSU / Union-Find</option>
    </optgroup>
    <optgroup label="── Graph">
      <option value="graph">Graph / BFS / DFS</option>
      <option value="shortest_path">Shortest Path (Dijkstra)</option>
    </optgroup>
    <optgroup label="── Algorithms">
      <option value="dp">Dynamic Programming</option>
      <option value="binary_search">Binary Search</option>
      <option value="two_pointers">Two Pointers / Sliding Window</option>
      <option value="backtracking">Backtracking</option>
      <option value="greedy">Greedy</option>
    </optgroup>
    <optgroup label="── Math & Strings">
      <option value="math">Math / Number Theory</option>
      <option value="string_hashing">String Hashing</option>
    </optgroup>
  </select>

  <button class="btn-primary" id="generate-btn"> Generate &amp; Copy</button>

  <div id="detected-badge"></div>
  <div id="constraints-box"></div>
  <div class="status" id="status"></div>
</div>

<!-- : History -->
<div id="view-history" class="view">
  <div class="section-title">Last 5 generated templates</div>
  <div id="history-list"></div>
</div>

<div id="view-snippets" class="view">
  <div class="section-title">Saved snippets</div>
  <div id="snippets-list"></div>

  <hr class="divider" />

  <div class="section-title">Add new snippet</div>
  <label class="snippet-form-label" for="snippet-key">Name (used as template key)</label>
  <input type="text" id="snippet-key" placeholder="e.g.  my_dfs" />

  <label class="snippet-form-label" for="snippet-code">C++ code</label>
  <textarea id="snippet-code" rows="5" placeholder="// paste your snippet here"></textarea>

  <button class="btn-primary" id="save-snippet-btn">Save Snippet</button>
  <div class="status" id="snippet-status"></div>
</div>

<script src="popup.js"></script>
</body>
</html>
